# Default settings for the caribou CE-tool data pipeline ----------------------
#
# Every setting the pipeline uses is listed here with its default value.
# A project file (config/<project>.yaml) only needs the settings that differ.
# Settings are combined in this order, later files winning:
#   default.yaml  <  <project>.yaml  <  local.yaml (this computer only)  <  <project>.R
# local.yaml is not shared through git: use it for folder paths on your computer.
# <project>.R is optional, for programmers: it can change any setting with R code.
# See config/README.md.
#
# INPUTS. Wherever the pipeline reads data, the input is given as a "source":
#   path: "folder/file.tif"          a file on this computer (absolute, or relative to paths: data_in)
#   url: "https://..."               a web or cloud-drive (e.g. Google Drive) link, downloaded
#                                    with reproducible::prepInputs() into paths: inputs
#   target_file: "file.shp"          with url: which file to use from the download (e.g. inside a .zip)
#   archive: "file.zip"              with url: the archive's name, if prepInputs can't tell
# Give either path or url.

project:
  crs: "EPSG:3154"        # coordinate reference system for all spatial data (units must be metres)
  seed: 37                # random seed, so random steps are the same on every run

paths:
  data_in: ""             # folder that relative `path:` inputs are read from
  inputs: "inputs"        # folder where downloaded inputs are kept
  input_cache: ""         # folder for large national rasters downloaded with landscape: access:
                          # download, shared by projects (like reproducible.inputPaths);
                          # blank = use paths: inputs. Set it in local.yaml.
  outputs: "outputs"      # folder where the pipeline writes layers it builds (in <outputs>/<project>)
  shared: ""              # shared folder results are copied to after each run (e.g. a Google
                          # shared drive); set it in local.yaml, as the path differs by computer

# Caribou locations (GPS collar fixes) -----------------------------------------
locations:
  # Where the locations come from. A list, so several data sets can be combined.
  # Each entry is a source (path or url, see above) with `type: file`, a
  # Movebank study with `type: movebank`, or the B.C. telemetry exports with
  # `type: bc` (see config/README.md). Each can have its own `columns` and `input_crs`.
  sources: []
    # - type: file
    #   url: "https://drive.google.com/file/d/.../view"
    #   target_file: clean_NMC.RDS
    # - type: movebank
    #   study: "Klaza caribou"
    #   user: jwturner        # password is read from keyring::key_get("movebank", user)
  columns:                # names of the columns in the input data (default for every source)
    id: id                # animal (collar deployment) ID
    datetime: t_          # fix date and time (UTC)
    x: x_                 # x coordinate (easting or longitude)
    y: y_                 # y coordinate (northing or latitude)
    # hour: Hour          # optional: whole hour of the day, if datetime holds only the date
  keep_columns: []        # other input columns to keep (e.g. herd, jurisdiction); [] keeps all
  input_crs: "EPSG:3154"  # coordinate system of x and y in the input (EPSG:4326 for longitude/latitude)
  # Fixes that two sources both have (e.g. the same collars on Movebank and in a
  # government export): the copy from the source listed later is flagged in
  # column dup_source; the cleaning step source_duplicates removes them.
  source_duplicates: {max_m: 2, max_s: 60}   # same fix if this close in metres and seconds
  tz: UTC                 # time zone of datetime, if stored as text or as date plus hour (a source can set its own tz); converted to UTC

  # Cleaning steps run in the order listed. Leave the list empty ([]) if the
  # input is already clean. Each step's settings are under `params`.
  cleaning:
    steps: []
    # Steps for fixes with dates but no times (sources with `date_only: true`).
    # They only help shape the study area, so only steps that use positions apply.
    date_only_steps: [bounds, exclude_points]
    # Available steps:
    #   bounds          keep fixes inside a longitude/latitude box
    #   exclude_points  drop fixes near known false locations (e.g. a field office)
    #   capture_effect  drop the first days after each collar was put on
    #   dop             drop low-quality fixes (high dilution of precision)
    #   source_duplicates  drop fixes an earlier-listed source also has (see source_duplicates above)
    #   duplicates      drop duplicate fixes close in time (amt::flag_duplicates)
    #   fast_steps      drop unrealistically fast steps (amt::flag_fast_steps)
    #   roundtrips      drop fast out-and-back spikes (amt::flag_roundtrips)
    #   clusters        flag (not drop) possible dead or dropped collars, amt's rule (amt::flag_defunct_clusters): column defunct_cluster_
    #   end_clusters    flag (not drop) a stationary end of track, incl. a collar moved to an office: column end_cluster_
    #   speed           drop steps faster than a speed limit (simple, quick version)
    #   min_points      drop animals with too few fixes
    params:
      bounds: {xmin: -180, ymin: -90, xmax: 180, ymax: 90}
      exclude_points: []  # list of {name:, lon:, lat:, radius_m:}
      capture_effect: {days: 7}
      dop: {column: gps_dop, max_dop: 10, keep_missing: true}
      duplicates: {gamma_minutes: 15, dop_column: gps_dop}
      fast_steps: {delta: 200000}
      roundtrips: {delta: 100000, epsilon: 10}
      clusters: {zeta: 200, eta: 3, theta_hours: 48}
      end_clusters: {zeta: 200, theta_hours: 48, max_moves: 2, transit_fixes: 5}  # max_moves: times a collar may have been moved; transit_fixes: fixes while moved
      speed: {max_m_per_hr: 12000}
      min_points: {n: 3}

  # Study area: the area landscape layers are prepared for.
  study_area:
    source: null          # an existing polygon (a source: path or url) instead of building one
    buffer_m: 20000       # otherwise, buffer this far around every location ...
    convex_hull: false    # ... and optionally wrap the buffer in a convex hull
  crop_method: bbox       # keep locations inside the study area's bounding box ("bbox") or the polygon itself ("within")

# Movement tracks and random steps (integrated step selection analysis) -------
tracks:
  split_by: id            # column(s) that define one track; each is processed separately
  rate_hours: 11          # resample every track to one fix per this many hours
  tolerance_minutes: 120  # allowed deviation from that rate
  min_burst_n: 3          # drop runs of regular fixes ("bursts") with fewer fixes than this
  min_steps: 20           # drop tracks with fewer steps than this after resampling
  max_step_quantile: 0.99 # drop steps longer than this quantile of each track's step lengths
  n_random: 30            # random (available) steps per observed step
  sl_distr: gamma         # distribution fitted to step lengths
  ta_distr: vonmises      # distribution fitted to turning angles
  min_year: 2012          # keep steps from this year ...
  max_year: 2025          # ... to this year
  year_interval: 5        # round years down to this interval (column int.year)
  buffer_round_m: 50      # median step length is rounded down to this, for neighbourhood layers

# Test runs: use only part of the data. null = use everything.
subset:
  ids: null               # only these animals, e.g. [KZCH2425, TRCH2010]
  n_ids: null             # first n animals
  years: null             # only these years, e.g. [2020, 2021]

# Landscape layers -------------------------------------------------------------
landscape:
  layers: ""              # table of layers (CSV), relative to the config folder; see config/README.md.
                          # Each layer either uses existing rasters (path or url) or is built
                          # by the pipeline from source data (column `build`).

  # Template rasters: the grids every built layer is written onto, in the
  # project's crs (so distances are in true metres). All resolutions nest exactly.
  template:
    source: null          # your own finest template raster (a source: path or url); null = build one
    base_res: 30          # size of the finest cells in metres (the 30 m Landsat-based inputs)
    buffer_m: 50000       # how far beyond the study area the layers extend (50 km)
    factors: [8, 40, 160] # how many fine cells along each side make one coarser cell:
                          # 8 x 30 m = 240 m, 40 x 30 m = 1200 m, 160 x 30 m = 4800 m

  # How national rasters (e.g. CanLaD) are read: "stream" reads only the part
  # covering the study area straight from the web (nothing stored); "download"
  # saves each whole file once to paths: input_cache and reads it from there.
  access: stream

  # Distances (to harvest and human disturbance) also count features up to this
  # far beyond the template, so that a road just outside it is not missed
  distance_margin_m: 10000

  # Harvest: Canada Landsat Disturbance (CanLaD) 1965-1984 and annual maps from 1985
  harvest:
    recent_years: 2       # harvest this many years back (that year included) counts as recent,
                          # for presence (pa), density (dens) and distance (dist)
    canlad_annual:
      url: "https://ftp.maps.canada.ca/pub/nrcan_rncan/Forests_Foret/canlad_including_insect_defoliation/v1/Disturbances_Time_Series/canlad_annual_{year}_v1.tif"
      first_year: 1985
      last_year: 2024
      code: 2             # value meaning harvest (2 = Harvesting)
    canlad_old:           # 1965-1984: disturbance type, and the year from a second raster
      type_url: "https://ftp.maps.canada.ca/pub/nrcan_rncan/Forests_Foret/canada_disturbances_1965to1984/v1/canlad_1965_1984_disturbanceType.tif"
      year_url: "https://ftp.maps.canada.ca/pub/nrcan_rncan/Forests_Foret/canada_disturbances_1965to1984/v1/canlad_1965_1984_disturbanceYear.tif"
      code: 3             # type value meaning harvest (3 = harvest)

  # Land cover: yearly proportion of each class (build: landcover / landcover_cell).
  # Classes are kept as in the source, to be combined later in a biologically
  # meaningful way. A class can be renamed here; codes not listed are ignored.
  landcover:
    source: scanfi        # scanfi (SCANFI v3, 1985-2025) or ntems (NTEMS VLCE2, 1984-2022)
    window_m:             # radius (m) of the circular moving window, by resolution (as in
      240: 500            # make_landforest_prop); resolutions not listed get plain cell proportions
    scanfi:
      url: "https://ftp.maps.canada.ca/pub/nrcan_rncan/Forests_Foret/SCANFI/v3/cog_SCANFI_landcover_{year}_v3_20260528.tif"
      first_year: 1985
      last_year: 2025
      classes:            # source code: class name (https://open.canada.ca/data/en/dataset/50f132f9-f312-4951-bb9f-9ea99580f29f)
        1: water
        2: rock
        3: soil
        4: burn_scars
        5: lichen
        6: herbaceous
        7: low_shrubs
        8: tall_shrubs
        9: treed_broadleaf
        10: treed_mixed
        11: treed_coniferous
        12: treed_coniferous_lichen
        13: treed_coniferous_rock_soil
        14: treed_coniferous_herbs
        15: treed_coniferous_low_shrub
        16: treed_coniferous_tall_shrub
        17: cropland
        18: urban
        19: road
        20: snow_ice
    ntems:
      url: "https://opendata.nfis.org/downloads/forest_change/CA_forest_VLCE2_{year}.zip"
      archive_file: "CA_forest_VLCE2_{year}.tif"   # the raster inside the zip
      first_year: 1984
      last_year: 2022
      classes:
        20: water
        31: snow_ice
        32: rock_rubble
        33: exposed_barren_land
        40: bryoids
        50: shrubs
        80: wetland
        81: wetland_treed
        100: herbs
        210: coniferous
        220: broadleaf
        230: mixedwood

  # Human disturbance: roads, trails, seismic lines, mines, clearings... from one
  # or more sources, each sorted into categories (e.g. paved, unpaved, lfother) by
  # rules, and counted from the year each feature was built (build: disturb_dist,
  # disturb_pa, disturb_dens). The sources are set per project (see config/NMC.yaml
  # and config/README.md).
  disturbance:
    lookups: {}           # tables the rules can use, e.g. a reclassification spreadsheet
    sources: {}           # <name>: {url, files: [{file, category or rules, year, lookup}]}
                          # Downloads are kept in paths: input_cache and not repeated; add
                          # refresh: true to a source or lookup to download it again every run

# Running steps in parallel ---------------------------------------------------
# Usually set in local.yaml, as it depends on the computer.
run:
  workers: 1              # steps run at the same time (e.g. one year of a layer each);
                          # 1 = one at a time. Needs the crew package. Each worker uses
                          # memory and temporary disk space, so start with 2-4.
  memfrac: 0.6            # share of the computer's memory terra may use, split among workers
  google_email: null      # Google account whose saved login is used for Google Drive
                          # downloads (run googledrive::drive_auth() once with it)

# Extracting layer values at steps --------------------------------------------
extract:
  where: both             # extract at the step's "start", "end", or "both"
